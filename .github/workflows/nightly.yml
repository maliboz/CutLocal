name: Nightly model and release validation

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  CUTLOCAL_VERSION: 0.1.5

jobs:
  extended-validation:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore CutLocal.sln
          dotnet restore src\CutLocal.App\CutLocal.App.csproj --runtime win-x64 -p:PublishReadyToRun=true
          dotnet restore installer\CutLocal.Setup.wixproj

      - name: Build and run model-related tests
        shell: pwsh
        run: |
          dotnet build CutLocal.sln --configuration Release --no-restore
          dotnet test tests\CutLocal.IntegrationTests\CutLocal.IntegrationTests.csproj --configuration Release --no-build --no-restore
          dotnet test tests\CutLocal.GoldenImageTests\CutLocal.GoldenImageTests.csproj --configuration Release --no-build --no-restore
          dotnet test tests\CutLocal.StressTests\CutLocal.StressTests.csproj --configuration Release --no-build --no-restore

      - name: Validate restricted and standard model manifests
        shell: pwsh
        run: dotnet run --project tools\CutLocal.ModelTools\CutLocal.ModelTools.csproj --configuration Release --no-build -- assets\models\manifests --noncommercial

      - name: Build standard Windows packages
        shell: pwsh
        run: .\installer\Build-Release.ps1 -Version $env:CUTLOCAL_VERSION -DotNetPath (Get-Command dotnet).Source

      - name: Build macOS architecture archives
        shell: pwsh
        run: .\installer\Build-MacRelease.ps1 -Version $env:CUTLOCAL_VERSION -DotNetPath (Get-Command dotnet).Source

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CutLocal-standard-nightly
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 3
