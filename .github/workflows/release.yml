name: Release artifacts

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Three-part MSI/product version
        required: true
        default: 0.1.5
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve release inputs
        id: release
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:DISPATCH_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must contain exactly three numeric fields: $version"
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore release inputs
        shell: pwsh
        run: |
          dotnet restore CutLocal.sln
          dotnet restore src\CutLocal.App\CutLocal.App.csproj --runtime win-x64 -p:PublishReadyToRun=true
          dotnet restore installer\CutLocal.Setup.wixproj

      - name: Build and test release source
        shell: pwsh
        run: |
          dotnet format CutLocal.sln --verify-no-changes --no-restore --verbosity minimal
          dotnet build CutLocal.sln --configuration Release --no-restore
          dotnet test tests\CutLocal.UnitTests\CutLocal.UnitTests.csproj --configuration Release --no-build --no-restore
          dotnet test tests\CutLocal.IntegrationTests\CutLocal.IntegrationTests.csproj --configuration Release --no-build --no-restore
          dotnet test tests\CutLocal.GoldenImageTests\CutLocal.GoldenImageTests.csproj --configuration Release --no-build --no-restore
          dotnet test tests\CutLocal.StressTests\CutLocal.StressTests.csproj --configuration Release --no-build --no-restore
          dotnet run --project tools\CutLocal.ModelTools\CutLocal.ModelTools.csproj --configuration Release --no-build -- assets\models\manifests --noncommercial
          .\installer\Validate-LicenseInventory.ps1

      - name: Import optional code-signing certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            if ($env:REQUIRE_SIGNING -eq 'true') {
              throw 'Signing is required, but WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured.'
            }
            'thumbprint=' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            return
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw 'The signing certificate password secret is missing.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'cutlocal-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            "thumbprint=$($certificate.Thumbprint)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build release artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SIGNING_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $parameters = @{
            Version = $env:RELEASE_VERSION
            DotNetPath = (Get-Command dotnet).Source
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
            $parameters.SigningCertificateThumbprint = $env:SIGNING_THUMBPRINT
          }
          .\installer\Build-Release.ps1 @parameters

      - name: Build macOS architecture archives
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: .\installer\Build-MacRelease.ps1 -Version $env:RELEASE_VERSION -DotNetPath (Get-Command dotnet).Source

      - name: Verify release signatures
        if: steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $targets = @(
            'artifacts\release-work\portable\CutLocal\CutLocal.exe',
            'artifacts\release\CutLocal-${{ steps.release.outputs.version }}-win-x64-setup.msi'
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $target: $($signature.Status)"
            }
          }

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/release/*

      - name: Publish GitHub release for tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.release.outputs.version }}"
          $title = "CutLocal $tag"
          $assets = @(Get-ChildItem artifacts\release -File | ForEach-Object FullName)
          if ($assets.Count -eq 0) {
            throw 'No release assets were produced.'
          }

          $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference

          if ($releaseExists) {
            gh release upload $tag @assets --clobber
          }
          else {
            gh release create $tag @assets --verify-tag --generate-notes --title $title
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed for $tag."
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CutLocal-${{ steps.release.outputs.version }}-all-platforms
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
